<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İngilizce Konuşma Pratiği</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap">
<style>
:root{
  --bg:#f5f5f0; --surface:#ffffff; --surface-alt:#fafaf8; --surface-sunken:#fafaf8;
  --border:#e5e5de; --border-soft:#f0f0e8;
  --text:#1a1a1a; --text-muted:#87877f; --text-faint:#aaaaa2;
  --accent:#2d7dd2; --accent-contrast:#ffffff;
  --success:#1D9E75; --danger:#D85A30; --warning:#c47a1a;
  --badge-bg-bg:#EAF3DE; --badge-bg-fg:#2d6b0a;
  --badge-br-bg:#FCEBEB; --badge-br-fg:#a32d2d;
  --badge-ba-bg:#FAEEDA; --badge-ba-fg:#854F0B;
  --badge-bb-bg:#E6F1FB; --badge-bb-fg:#185FA5;
  --badge-bk-bg:#f0f0ec; --badge-bk-fg:#63635c;
  --bubble-app:#eef3fb; --bubble-user:#fff6e8;
  --banner-bg:#fffbf5; --banner-border:#f0ddb5; --banner-text:#7a5a12;
  --shadow:0 1px 2px rgba(20,20,15,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17181b; --surface:#212226; --surface-alt:#26282c; --surface-sunken:#1e1f23;
    --border:#35373c; --border-soft:#2c2e32;
    --text:#ececea; --text-muted:#9c9c97; --text-faint:#78786f;
    --accent:#67a8ec; --accent-contrast:#0f1114;
    --success:#57c79e; --danger:#e5825f; --warning:#dda85e;
    --badge-bg-bg:#1c3122; --badge-bg-fg:#83d69e;
    --badge-br-bg:#3a2220; --badge-br-fg:#f0a595;
    --badge-ba-bg:#3a2c15; --badge-ba-fg:#eabb70;
    --badge-bb-bg:#172c3f; --badge-bb-fg:#92c4f2;
    --badge-bk-bg:#2c2e32; --badge-bk-fg:#b6b6b0;
    --bubble-app:#1c2b3a; --bubble-user:#332a19;
    --banner-bg:#2b2310; --banner-border:#5a4a1e; --banner-text:#eac878;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#17181b; --surface:#212226; --surface-alt:#26282c; --surface-sunken:#1e1f23;
  --border:#35373c; --border-soft:#2c2e32;
  --text:#ececea; --text-muted:#9c9c97; --text-faint:#78786f;
  --accent:#67a8ec; --accent-contrast:#0f1114;
  --success:#57c79e; --danger:#e5825f; --warning:#dda85e;
  --badge-bg-bg:#1c3122; --badge-bg-fg:#83d69e;
  --badge-br-bg:#3a2220; --badge-br-fg:#f0a595;
  --badge-ba-bg:#3a2c15; --badge-ba-fg:#eabb70;
  --badge-bb-bg:#172c3f; --badge-bb-fg:#92c4f2;
  --badge-bk-bg:#2c2e32; --badge-bk-fg:#b6b6b0;
  --bubble-app:#1c2b3a; --bubble-user:#332a19;
  --banner-bg:#2b2310; --banner-border:#5a4a1e; --banner-text:#eac878;
  --shadow:0 1px 3px rgba(0,0,0,.35);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
h1{font-family:'Sora',-apple-system,sans-serif;font-size:21px;font-weight:700;letter-spacing:-.3px;text-wrap:balance}
.subtitle{font-size:13px;color:var(--text-muted);margin-top:4px;margin-bottom:1.2rem;max-width:56ch}

.warn-banner{background:var(--banner-bg);border:1px solid var(--banner-border);color:var(--banner-text);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:1.1rem;line-height:1.5}

.tabs{display:flex;background:var(--surface);border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:1.2rem;flex-wrap:wrap}
.tab{padding:10px 15px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text-muted);font-weight:600;border-bottom:2px solid transparent;flex:1;text-align:center;white-space:nowrap}
.tab:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab.active{color:var(--text);border-bottom-color:var(--text);background:var(--surface-sunken)}
.sec{display:none}.sec.active{display:block}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.ct{font-family:'Sora',-apple-system,sans-serif;font-size:14.5px;font-weight:700}
.muted{color:var(--text-muted);font-size:12.5px}

.bdg{font-size:11px;padding:3px 9px;border-radius:6px;font-weight:700;display:inline-block;white-space:nowrap}
.bg{background:var(--badge-bg-bg);color:var(--badge-bg-fg)}.br{background:var(--badge-br-bg);color:var(--badge-br-fg)}
.ba{background:var(--badge-ba-bg);color:var(--badge-ba-fg)}.bb{background:var(--badge-bb-bg);color:var(--badge-bb-fg)}
.bk{background:var(--badge-bk-bg);color:var(--badge-bk-fg)}

.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters select{font-size:12.5px;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ab{background:var(--text);border:none;border-radius:7px;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--bg);font-weight:700}
.ab:hover{opacity:.85}
.ab2{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--text);font-weight:600}
.ab2:hover{background:var(--surface-alt)}
.mini-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:0 2px}

.mic-btn{background:var(--accent);border:none;border-radius:7px;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--accent-contrast);font-weight:700}
.mic-btn:hover{filter:brightness(1.08)}
.mic-btn[disabled]{background:var(--border);cursor:not-allowed;color:var(--text-faint)}
.mic-btn.recording{background:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,90,48,.45)}70%{box-shadow:0 0 0 9px rgba(216,90,48,0)}100%{box-shadow:0 0 0 0 rgba(216,90,48,0)}}
@media (prefers-reduced-motion: reduce){.mic-btn.recording{animation:none}}

.result-box{background:var(--surface-alt);border:1px solid var(--border-soft);border-radius:9px;padding:10px 12px;margin-top:10px;font-size:13px}
.score-row{margin-bottom:6px}
.diff-line{margin-top:5px;line-height:1.7}
.diff-lbl{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px;margin-right:4px}
.w{margin-right:4px;display:inline-block}
.w.ok{color:var(--success);font-weight:700}
.w.miss{color:var(--danger);text-decoration:line-through}
.w.extra{color:var(--warning)}
.err-msg{color:var(--danger);font-size:12.5px;margin-top:8px}

.bubble{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13.5px;max-width:92%}
.bubble.app{background:var(--bubble-app);margin-right:auto}
.bubble.user{background:var(--bubble-user);margin-left:auto}
.bubble.current{border:1.5px solid var(--accent)}
.bubble-role{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;font-weight:700}
.bubble-text{line-height:1.5}

.hint{font-size:12.5px;color:var(--text-muted);margin-bottom:8px}

.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.2rem}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow)}
.mc label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.mc .v{font-family:'Sora',-apple-system,sans-serif;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}

.wf-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.wf-lbl{width:135px;color:var(--text-muted);font-size:12px;flex-shrink:0}
.wf-bw{flex:1;height:9px;background:var(--border-soft);border-radius:4px;overflow:hidden}
.wf-bf{height:100%;border-radius:4px;background:var(--accent)}
.wf-val{min-width:40px;text-align:right;font-weight:700;font-size:12px;flex-shrink:0;font-variant-numeric:tabular-nums}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:700;font-size:11px;color:var(--text-faint);padding:5px 7px;border-bottom:1px solid var(--border-soft);text-transform:uppercase;letter-spacing:.3px}
td{padding:7px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto}

textarea{font-family:inherit;resize:vertical;background:var(--surface);color:var(--text);border-color:var(--border)}
select,input[type=range]{font-size:12.5px}
.field-row{margin-bottom:16px}
.field-lbl{font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.rate-val{font-size:12.5px;color:var(--text);font-weight:700;margin-left:8px;font-variant-numeric:tabular-nums}
.status-line{font-size:12.5px;margin-bottom:6px;color:var(--text)}
</style>
</head>

// ── Veri: diyalog senaryoları ──
const DIALOGUES = [
  {
    id:'cafe', title:'Kafede Sipariş Verme', level:'Başlangıç',
    desc:'Bir kafede içecek sipariş etmeyi pratik et.',

// remove the stray empty placeholder line accidentally kept above
DIALOGUES[2].lines = DIALOGUES[2].lines.filter(l => !(l.speaker==='app2'));

// ── Durum / kalıcı depolama ──
const STORAGE_KEY = 'ing_pratik_v1';
const DEFAULT_STATE = { attempts:[], bestScores:{}, dialogProgress:{}, settings:{voiceURI:'', accent:'en-US', rate:0.95} };

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      return Object.assign({}, DEFAULT_STATE, d, {settings: Object.assign({}, DEFAULT_STATE.settings, d.settings||{})});
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

let state = load();
let settings = state.settings;

let currentTab = 'pratik';
const TABS = ['pratik','diyalog','serbest','istatistik','ayarlar'];
let currentDialogueId = null;
let filterCat = 'all';
let filterLevel = 'all';
let freeText = '';
let liveResults = {};
let errorMsgs = {};
let recState = {active:false, kind:null, key:null, rec:null};

// ── Yardımcılar ──
function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function catLabel(slug){
  const c = CATEGORIES.find(x=>x.slug===slug);
  if(c) return c.label;
  if(slug==='serbest') return 'Serbest Pratik';
  const d = DIALOGUES.find(x=>x.id===slug);
  return d ? d.title : slug;
}
function scoreBadgeClass(score){ return score>=85 ? 'bg' : score>=60 ? 'ba' : 'br'; }
function levelBadgeClass(level){ return level==='Başlangıç' ? 'bg' : level==='Orta' ? 'ba' : 'br'; }

// ── Kelime hizalama / skor (LCS tabanlı) ──
function normWords(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean); }
function alignWords(target, spoken){
  const a = normWords(target), b = normWords(spoken);
  const n=a.length, m=b.length;
  const dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  let i=n, j=m;
  const aMatch = new Array(n).fill(false), bMatch = new Array(m).fill(false);
  while(i>0 && j>0){
    if(a[i-1]===b[j-1]){ aMatch[i-1]=true; bMatch[j-1]=true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--; else j--;
  }
  const score = n ? Math.round(dp[n][m]/n*100) : 0;
  return {targetWords:a, spokenWords:b, aMatch, bMatch, score};
}
function renderDiffHTML(align){
  const tHtml = align.targetWords.map((w,idx)=>`<span class="w ${align.aMatch[idx]?'ok':'miss'}">${escapeHtml(w)}</span>`).join('');
  const sHtml = align.spokenWords.length ? align.spokenWords.map((w,idx)=>`<span class="w ${align.bMatch[idx]?'ok':'extra'}">${escapeHtml(w)}</span>`).join('') : '<span class="muted">(algılanamadı)</span>';
  return {tHtml, sHtml};
}
function keywordScore(spoken, keywords){
  if(!keywords || !keywords.length) return spoken.trim() ? 80 : 0;
  const norm = ' ' + String(spoken||'').toLowerCase().replace(/[^a-z0-9' ]+/g,' ') + ' ';
  let hit = 0;
  keywords.forEach(k => { if(norm.includes(k.toLowerCase())) hit++; });
  return Math.round(hit/keywords.length*100);
}

// ── Ses sentezi (native/doğal ses) ──
function accentLang(){ return settings.accent || 'en-US'; }
function refreshVoices(){
  if(!('speechSynthesis' in window)) return;
  voices = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('en'));
  if(currentTab==='ayarlar') renderAyarlar();
}
function getSelectedVoice(){
  if(settings.voiceURI){
    const v = voices.find(x=>x.voiceURI===settings.voiceURI);
    if(v) return v;
  }
  const accent = accentLang();
  const natural = voices.find(v => v.lang===accent && /natural|online|neural/i.test(v.name));
  if(natural) return natural;
  const exact = voices.find(v => v.lang===accent);
  if(exact) return exact;
  const primary = accent.split('-')[0];
  const partial = voices.find(v => v.lang.toLowerCase().startsWith(primary));
  if(partial) return partial;
  return voices[0] || null;
}
function speak(text, rateOverride){
  if(!('speechSynthesis' in window) || !text) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  const v = getSelectedVoice();
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = accentLang(); }
  u.rate = rateOverride || settings.rate || 0.95;
  speechSynthesis.speak(u);
}
function speakSentence(id){ const s = SENTENCES.find(x=>x.id===id); if(s) speak(s.en); }
function speakDialogueLine(dialogueId, lineIndex){ const d = DIALOGUES.find(x=>x.id===dialogueId); if(d && d.lines[lineIndex]) speak(d.lines[lineIndex].text); }
function speakDialogueModel(dialogueId, lineIndex){ const d = DIALOGUES.find(x=>x.id===dialogueId); if(d && d.lines[lineIndex]) speak(d.lines[lineIndex].model); }
function speakFreeText(){ const el = document.getElementById('free-input'); speak(el ? el.value : freeText); }

// ── Konuşma tanıma (mikrofon) ──
function micSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function toggleMic(kind, key){
  if(recState.active){
    if(recState.kind===kind && String(recState.key)===String(key)) recState.rec.stop();
    return;
  }
  if(!micSupported()){ alert('Tarayıcınız gerçek zamanlı konuşma tanımayı desteklemiyor. Lütfen bilgisayarda Google Chrome veya Microsoft Edge kullanın.'); return; }
  if(kind==='free'){
    const el = document.getElementById('free-input');
    const txt = el ? el.value : freeText;
    if(!txt || !txt.trim()){ alert('Önce pratik edeceğin İngilizce metni yaz.'); return; }
  }
  delete errorMsgs[kind+':'+key];
  const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SRClass();
  rec.lang = accentLang();
  rec.interimResults = false;
  rec.continuous = false;
  rec.maxAlternatives = 1;
  recState = {active:true, kind, key, rec};
  renderCurrent();
  rec.onresult = (e) => {
    let t = '';
    for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript;
    handleTranscript(kind, key, t.trim());
  };
  rec.onerror = (e) => {
    recState = {active:false, kind:null, key:null, rec:null};
    errorMsgs[kind+':'+key] = e.error==='no-speech' ? 'Ses algılanamadı, tekrar deneyin.'
      : e.error==='not-allowed' ? 'Mikrofon izni verilmedi. Tarayıcı ayarlarından izin verin.'
      : 'Bir hata oluştu: ' + e.error;
    renderCurrent();
  };
  rec.onend = () => {
    if(recState.active && recState.kind===kind && String(recState.key)===String(key)){
      recState = {active:false, kind:null, key:null, rec:null};
      renderCurrent();
    }
  };
  try{ rec.start(); }catch(err){ recState = {active:false, kind:null, key:null, rec:null}; }
}
function micButtonHTML(kind, key){
  const isThis = recState.active && recState.kind===kind && String(recState.key)===String(key);
  const otherActive = recState.active && !isThis;
  const label = isThis ? '⏹ Durdur' : '🎤 Kaydet';
  const cls = 'mic-btn' + (isThis ? ' recording' : '');
  const disabledAttr = otherActive ? 'disabled' : '';
  const keyArg = typeof key==='number' ? key : `'${key}'`;
  return `<button class="${cls}" ${disabledAttr} onclick="toggleMic('${kind}', ${keyArg})">${label}</button>`;
}
function resultBlockHTML(kind, key){
  const err = errorMsgs[kind+':'+key];
  if(err) return `<div class="err-msg">⚠️ ${escapeHtml(err)}</div>`;
  const r = liveResults[kind+':'+key];
  if(!r) return '';
  const {tHtml, sHtml} = renderDiffHTML(r.align);
  return `<div class="result-box">
    <div class="score-row"><span class="bdg ${scoreBadgeClass(r.align.score)}">Skor: ${r.align.score}</span></div>
    <div class="diff-line"><span class="diff-lbl">Hedef</span><br>${tHtml}</div>
    <div class="diff-line"><span class="diff-lbl">Senin söylediğin</span><br>${sHtml}</div>
  </div>`;
}

function recordAttempt(obj){
  state.attempts.unshift(Object.assign({ts:Date.now()}, obj));
  if(state.attempts.length>500) state.attempts.length = 500;
}
function updateBest(id, score){
  if(!(id in state.bestScores) || score > state.bestScores[id]) state.bestScores[id] = score;
}
function handleTranscript(kind, key, transcript){
  if(kind==='sentence'){
    const s = SENTENCES.find(x=>x.id===Number(key));
    if(!s) return;
    const align = alignWords(s.en, transcript);
    liveResults['sentence:'+key] = {transcript, align};
    updateBest(s.id, align.score);
    recordAttempt({kind:'sentence', cat:s.cat, text:s.en, score:align.score});
  } else if(kind==='free'){
    const el = document.getElementById('free-input');
    const target = (el ? el.value : freeText) || '';
    const align = alignWords(target, transcript);
    liveResults['free:'+key] = {transcript, align};
    recordAttempt({kind:'free', cat:'serbest', text:target.slice(0,80), score:align.score});
  } else if(kind==='dialogue'){
    const idx = key.lastIndexOf(':');
    const dlgId = key.slice(0, idx);
    const lineIndex = Number(key.slice(idx+1));
    const d = DIALOGUES.find(x=>x.id===dlgId);
    if(!d) return;
    const line = d.lines[lineIndex];
    const score = keywordScore(transcript, line.keywords);
    if(!state.dialogProgress[dlgId]) state.dialogProgress[dlgId] = {lineIndex:0, answers:{}};
    state.dialogProgress[dlgId].answers[lineIndex] = {transcript, score};
    recordAttempt({kind:'dialogue', cat:dlgId, text:line.model, score});
  }
  save();
  renderCurrent();
}

// ── Sekme geçişi ──
function sw(n){
  currentTab = n;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', TABS[i]===n));
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
  document.getElementById('s-'+n).classList.add('active');
  renderCurrent();
}
function renderCurrent(){
  if(currentTab==='pratik') renderPratik();
  else if(currentTab==='diyalog') renderDiyalog();
  else if(currentTab==='serbest') renderSerbest();
  else if(currentTab==='istatistik') renderIstatistik();
  else if(currentTab==='ayarlar') renderAyarlar();
}

// ── RENDER: PRATİK ──
function setFilterCat(v){ filterCat = v; renderPratik(); }
function setFilterLevel(v){ filterLevel = v; renderPratik(); }
function renderPratik(){
  const catOpts = ['<option value="all">Tüm kategoriler</option>']
    .concat(CATEGORIES.map(c => `<option value="${c.slug}" ${filterCat===c.slug?'selected':''}>${c.label}</option>`)).join('');
  const levels = ['Başlangıç','Orta','İleri'];
  const lvlOpts = ['<option value="all">Tüm seviyeler</option>']
    .concat(levels.map(l => `<option value="${l}" ${filterLevel===l?'selected':''}>${l}</option>`)).join('');

  const list = SENTENCES.filter(s => {
    const cat = CATEGORIES.find(c=>c.slug===s.cat);
    if(filterCat!=='all' && s.cat!==filterCat) return false;
    if(filterLevel!=='all' && cat.level!==filterLevel) return false;
    return true;
  });

  const cards = list.map(s => {
    const cat = CATEGORIES.find(c=>c.slug===s.cat);
    const best = state.bestScores[s.id];
    const bestBadge = best!==undefined ? `<span class="bdg ${scoreBadgeClass(best)}">En iyi: ${best}</span>` : `<span class="bdg bk">Henüz denenmedi</span>`;
    return `<div class="card">
      <div class="ch">
        <span class="ct">${escapeHtml(s.en)}</span>
        <span style="display:flex;gap:6px">
          <span class="bdg ${levelBadgeClass(cat.level)}">${cat.level}</span>
          ${bestBadge}
        </span>
      </div>
      <div class="muted">${escapeHtml(s.tr)}</div>
      <div class="actions">
        <button class="ab2" onclick="speakSentence(${s.id})">🔊 Dinle</button>
        ${micButtonHTML('sentence', s.id)}
      </div>
      ${resultBlockHTML('sentence', s.id)}
    </div>`;
  }).join('');

  document.getElementById('s-pratik').innerHTML = `
    <div class="filters">
      <select onchange="setFilterCat(this.value)">${catOpts}</select>
      <select onchange="setFilterLevel(this.value)">${lvlOpts}</select>
    </div>
    ${cards || '<div class="card muted">Bu filtrelerle eşleşen cümle bulunamadı.</div>'}
  `;
}

// ── RENDER: DİYALOG ──
function openDialogue(id){
  currentDialogueId = id;
  if(!state.dialogProgress[id]) state.dialogProgress[id] = {lineIndex:0, answers:{}};
  maybeSpeakCurrentDialogueLine();
  save();
  renderCurrent();
}
function backToDialogueList(){ currentDialogueId = null; renderCurrent(); }
function maybeSpeakCurrentDialogueLine(){
  const d = DIALOGUES.find(x=>x.id===currentDialogueId);
  if(!d) return;
  const prog = state.dialogProgress[d.id];
  if(prog.lineIndex < d.lines.length && d.lines[prog.lineIndex].speaker==='app'){
    speak(d.lines[prog.lineIndex].text);
  }
}
function advanceDialogue(){
  const d = DIALOGUES.find(x=>x.id===currentDialogueId);
  const prog = state.dialogProgress[d.id];
  prog.lineIndex++;
  save();
  maybeSpeakCurrentDialogueLine();
  renderCurrent();
}
function restartDialogue(id){
  state.dialogProgress[id] = {lineIndex:0, answers:{}};
  currentDialogueId = id;
  save();
  maybeSpeakCurrentDialogueLine();
  renderCurrent();
}
function renderDiyalog(){
  if(!currentDialogueId){
    const cards = DIALOGUES.map(d => {
      const prog = state.dialogProgress[d.id];
      const doneIdx = prog ? prog.lineIndex : 0;
      const completed = prog && prog.lineIndex >= d.lines.length;
      const statusLabel = completed ? 'Tamamlandı ✅' : doneIdx>0 ? `Devam ediyor (${doneIdx}/${d.lines.length})` : 'Başlanmadı';
      const btnLabel = completed ? 'Tekrar Yap' : doneIdx>0 ? 'Devam Et' : 'Başla';
      return `<div class="card">
        <div class="ch">
          <span class="ct">${escapeHtml(d.title)}</span>
          <span class="bdg ${levelBadgeClass(d.level)}">${d.level}</span>
        </div>
        <div class="muted">${escapeHtml(d.desc)}</div>
        <div class="actions" style="align-items:center;justify-content:space-between">
          <span class="muted">${statusLabel}</span>
          <button class="ab" onclick="openDialogue('${d.id}')">${btnLabel}</button>
        </div>
      </div>`;
    }).join('');
    document.getElementById('s-diyalog').innerHTML = cards;
    return;
  }

  const d = DIALOGUES.find(x=>x.id===currentDialogueId);
  const prog = state.dialogProgress[d.id];
  let history = '';
  for(let i=0;i<Math.min(prog.lineIndex, d.lines.length);i++){
    const line = d.lines[i];
    if(line.speaker==='app'){
      history += `<div class="bubble app"><div class="bubble-role">🤖 Konuşma Partneri</div><div class="bubble-text">${escapeHtml(line.text)}</div></div>`;
    } else {
      const ans = prog.answers[i];
      history += `<div class="bubble user"><div class="bubble-role">Sen</div><div class="bubble-text">${ans ? escapeHtml(ans.transcript || '(sessiz)') : ''}</div>${ans ? `<div style="margin-top:4px"><span class="bdg ${scoreBadgeClass(ans.score)}">Skor: ${ans.score}</span></div>` : ''}</div>`;
    }
  }

  let current = '';
  if(prog.lineIndex < d.lines.length){
    const line = d.lines[prog.lineIndex];
    if(line.speaker==='app'){
      current = `<div class="bubble app current">
        <div class="bubble-role">🤖 Konuşma Partneri</div>
        <div class="bubble-text">${escapeHtml(line.text)}</div>
        <div class="actions" style="margin-top:8px">
          <button class="ab2" onclick="speakDialogueLine('${d.id}', ${prog.lineIndex})">🔊 Tekrar Dinle</button>
          <button class="ab" onclick="advanceDialogue()">Devam →</button>
        </div>
      </div>`;
    } else {
      const key = d.id + ':' + prog.lineIndex;
      const ans = prog.answers[prog.lineIndex];
      current = `<div class="bubble user current">
        <div class="bubble-role">Senin Sıran</div>
        <div class="hint">💡 ${escapeHtml(line.hint)}</div>
        <div class="actions">${micButtonHTML('dialogue', key)}</div>
        ${errorMsgs['dialogue:'+key] ? `<div class="err-msg">⚠️ ${escapeHtml(errorMsgs['dialogue:'+key])}</div>` : ''}
        ${ans ? `
          <div class="result-box">
            <div class="score-row"><span class="bdg ${scoreBadgeClass(ans.score)}">Skor: ${ans.score}</span></div>
            <div class="diff-line"><span class="diff-lbl">Sen dedin ki</span><br>${escapeHtml(ans.transcript || '(sessiz)')}</div>
            <div class="diff-line"><span class="diff-lbl">Örnek cevap</span><br>${escapeHtml(line.model)} <button class="mini-btn" onclick="speakDialogueModel('${d.id}', ${prog.lineIndex})">🔊</button></div>
          </div>
          <div class="actions"><button class="ab" onclick="advanceDialogue()">Sonraki →</button></div>
        ` : ''}
      </div>`;
    }
  } else {
    const scores = Object.values(prog.answers).map(a=>a.score);
    const avg = scores.length ? Math.round(scores.reduce((s,v)=>s+v,0)/scores.length) : 0;
    current = `<div class="card" style="background:var(--surface-alt)">
      <div class="ct">🎉 Diyalog tamamlandı!</div>
      <div class="muted" style="margin:8px 0">Ortalama skor: <b>${avg}</b></div>
      <div class="actions">
        <button class="ab2" onclick="restartDialogue('${d.id}')">Baştan Başla</button>
        <button class="ab" onclick="backToDialogueList()">Diyalog Listesine Dön</button>
      </div>
    </div>`;
  }

  document.getElementById('s-diyalog').innerHTML = `
    <div class="ch" style="margin-bottom:10px">
      <button class="ab2" onclick="backToDialogueList()">← Geri</button>
      <span class="bdg ${levelBadgeClass(d.level)}">${d.level}</span>
    </div>
    <div class="ct" style="margin-bottom:10px">${escapeHtml(d.title)}</div>
    ${history}
    ${current}
  `;
}

// ── RENDER: İSTATİSTİK ──
function computeStreak(){
  const days = new Set(state.attempts.map(a => new Date(a.ts).toDateString()));
  let d = new Date(); d.setHours(0,0,0,0);
  if(!days.has(d.toDateString())) d.setDate(d.getDate()-1);
  let streak = 0;
  while(days.has(d.toDateString())){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function resetStats(){
  if(!confirm('Tüm ilerleme ve istatistikler silinecek. Emin misin?')) return;
  state.attempts = []; state.bestScores = {}; state.dialogProgress = {};
  save(); renderCurrent();
}
function renderIstatistik(){
  const attempts = state.attempts;
  const total = attempts.length;
  const avg = total ? Math.round(attempts.reduce((s,a)=>s+a.score,0)/total) : 0;
  const streak = computeStreak();

  const byCat = {};
  attempts.forEach(a => { (byCat[a.cat] = byCat[a.cat] || []).push(a.score); });
  const catAvgs = Object.entries(byCat).map(([cat,scores]) => ({
    cat, avg: Math.round(scores.reduce((s,v)=>s+v,0)/scores.length), count: scores.length
  })).sort((a,b) => b.avg - a.avg);

  const rows = attempts.slice(0,15).map(a => {
    const dt = new Date(a.ts);
    const dstr = dt.toLocaleDateString('tr-TR') + ' ' + dt.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    const text = (a.text||'').length>42 ? a.text.slice(0,42)+'…' : a.text;
    return `<tr>
      <td class="muted">${dstr}</td>
      <td>${escapeHtml(catLabel(a.cat))}</td>
      <td>${escapeHtml(text)}</td>
      <td><span class="bdg ${scoreBadgeClass(a.score)}">${a.score}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('s-istatistik').innerHTML = `
    <div class="mg">
      <div class="mc"><label>Toplam Deneme</label><div class="v">${total}</div></div>
      <div class="mc"><label>Ortalama Skor</label><div class="v">${avg}</div></div>
      <div class="mc"><label>Pratik Serisi</label><div class="v">${streak} gün</div></div>
    </div>

    <div class="card">
      <div class="ch"><span class="ct">Kategori bazlı ortalama</span></div>
      ${catAvgs.length ? catAvgs.map(c => `
        <div class="wf-row">
          <div class="wf-lbl">${escapeHtml(catLabel(c.cat))}</div>
          <div class="wf-bw"><div class="wf-bf" style="width:${c.avg}%"></div></div>
          <div class="wf-val">${c.avg}</div>
        </div>`).join('') : '<div class="muted">Henüz veri yok.</div>'}
    </div>

    <div class="card">
      <div class="ch"><span class="ct">Son denemeler</span></div>
      ${rows ? `<table><thead><tr><th>Tarih</th><th>Kategori</th><th>Metin</th><th>Skor</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="muted">Henüz pratik yapılmadı.</div>'}
    </div>

    <div class="actions"><button class="ab2" onclick="resetStats()">Verileri Sıfırla</button></div>
  `;
}

        <input type="range" min="0.6" max="1.3" step="0.05" value="${settings.rate}" style="width:100%" oninput="onRateInput(this.value)" onchange="onRateChange(this.value)">
      </div>

      <div class="actions"><button class="ab" onclick="speak('Hello! This is a test of the selected voice. I hope it sounds clear and natural.')">🔊 Test Et</button></div>
    </div>

    <div class="card">
      <div class="ct" style="margin-bottom:10px">Tarayıcı Desteği</div>
      <div class="status-line">🎤 Konuşma tanıma (mikrofon): ${micSupported() ? '✅ Destekleniyor' : '❌ Desteklenmiyor'}</div>
      <div class="status-line">🔊 Sesli okuma: ${('speechSynthesis' in window) ? '✅ Destekleniyor' : '❌ Desteklenmiyor'}</div>
      <div class="muted">En iyi deneyim için bilgisayarda Google Chrome veya Microsoft Edge kullanılması önerilir.</div>
    </div>
  `;
}

// ── Başlangıç ──
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = refreshVoices; refreshVoices(); }
if(!micSupported()){
  document.getElementById('banner').innerHTML = `<div class="warn-banner">🎤 Tarayıcınız gerçek zamanlı konuşma tanımayı desteklemiyor. En iyi deneyim için bilgisayarda <b>Google Chrome</b> veya <b>Microsoft Edge</b> kullanmanızı öneririz. Dinleme (seslendirme) özellikleri yine de çalışır.</div>`;
}
renderCurrent();
</script>
</body>
</html>
