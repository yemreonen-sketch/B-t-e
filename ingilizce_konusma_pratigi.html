<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İngilizce Konuşma Pratiği</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap">
<style>
:root{
  --bg:#f5f5f0; --surface:#ffffff; --surface-alt:#fafaf8; --surface-sunken:#fafaf8;
  --border:#e5e5de; --border-soft:#f0f0e8;
  --text:#1a1a1a; --text-muted:#87877f; --text-faint:#aaaaa2;
  --accent:#2d7dd2; --accent-contrast:#ffffff;
  --success:#1D9E75; --danger:#D85A30; --warning:#c47a1a;
  --badge-bg-bg:#EAF3DE; --badge-bg-fg:#2d6b0a;
  --badge-br-bg:#FCEBEB; --badge-br-fg:#a32d2d;
  --badge-ba-bg:#FAEEDA; --badge-ba-fg:#854F0B;
  --badge-bb-bg:#E6F1FB; --badge-bb-fg:#185FA5;
  --badge-bk-bg:#f0f0ec; --badge-bk-fg:#63635c;
  --bubble-app:#eef3fb; --bubble-user:#fff6e8;
  --banner-bg:#fffbf5; --banner-border:#f0ddb5; --banner-text:#7a5a12;
  --shadow:0 1px 2px rgba(20,20,15,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17181b; --surface:#212226; --surface-alt:#26282c; --surface-sunken:#1e1f23;
    --border:#35373c; --border-soft:#2c2e32;
    --text:#ececea; --text-muted:#9c9c97; --text-faint:#78786f;
    --accent:#67a8ec; --accent-contrast:#0f1114;
    --success:#57c79e; --danger:#e5825f; --warning:#dda85e;
    --badge-bg-bg:#1c3122; --badge-bg-fg:#83d69e;
    --badge-br-bg:#3a2220; --badge-br-fg:#f0a595;
    --badge-ba-bg:#3a2c15; --badge-ba-fg:#eabb70;
    --badge-bb-bg:#172c3f; --badge-bb-fg:#92c4f2;
    --badge-bk-bg:#2c2e32; --badge-bk-fg:#b6b6b0;
    --bubble-app:#1c2b3a; --bubble-user:#332a19;
    --banner-bg:#2b2310; --banner-border:#5a4a1e; --banner-text:#eac878;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#17181b; --surface:#212226; --surface-alt:#26282c; --surface-sunken:#1e1f23;
  --border:#35373c; --border-soft:#2c2e32;
  --text:#ececea; --text-muted:#9c9c97; --text-faint:#78786f;
  --accent:#67a8ec; --accent-contrast:#0f1114;
  --success:#57c79e; --danger:#e5825f; --warning:#dda85e;
  --badge-bg-bg:#1c3122; --badge-bg-fg:#83d69e;
  --badge-br-bg:#3a2220; --badge-br-fg:#f0a595;
  --badge-ba-bg:#3a2c15; --badge-ba-fg:#eabb70;
  --badge-bb-bg:#172c3f; --badge-bb-fg:#92c4f2;
  --badge-bk-bg:#2c2e32; --badge-bk-fg:#b6b6b0;
  --bubble-app:#1c2b3a; --bubble-user:#332a19;
  --banner-bg:#2b2310; --banner-border:#5a4a1e; --banner-text:#eac878;
  --shadow:0 1px 3px rgba(0,0,0,.35);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
h1{font-family:'Sora',-apple-system,sans-serif;font-size:21px;font-weight:700;letter-spacing:-.3px;text-wrap:balance}
.subtitle{font-size:13px;color:var(--text-muted);margin-top:4px;margin-bottom:1.2rem;max-width:56ch}

.warn-banner{background:var(--banner-bg);border:1px solid var(--banner-border);color:var(--banner-text);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:1.1rem;line-height:1.5}

.tabs{display:flex;background:var(--surface);border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:1.2rem;flex-wrap:wrap}
.tab{padding:10px 15px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text-muted);font-weight:600;border-bottom:2px solid transparent;flex:1;text-align:center;white-space:nowrap}
.tab:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab.active{color:var(--text);border-bottom-color:var(--text);background:var(--surface-sunken)}
.sec{display:none}.sec.active{display:block}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.ct{font-family:'Sora',-apple-system,sans-serif;font-size:14.5px;font-weight:700}
.muted{color:var(--text-muted);font-size:12.5px}

.bdg{font-size:11px;padding:3px 9px;border-radius:6px;font-weight:700;display:inline-block;white-space:nowrap}
.bg{background:var(--badge-bg-bg);color:var(--badge-bg-fg)}.br{background:var(--badge-br-bg);color:var(--badge-br-fg)}
.ba{background:var(--badge-ba-bg);color:var(--badge-ba-fg)}.bb{background:var(--badge-bb-bg);color:var(--badge-bb-fg)}
.bk{background:var(--badge-bk-bg);color:var(--badge-bk-fg)}

.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters select{font-size:12.5px;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ab{background:var(--text);border:none;border-radius:7px;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--bg);font-weight:700}
.ab:hover{opacity:.85}
.ab2{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--text);font-weight:600}
.ab2:hover{background:var(--surface-alt)}
.mini-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:0 2px}

.mic-btn{background:var(--accent);border:none;border-radius:7px;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--accent-contrast);font-weight:700}
.mic-btn:hover{filter:brightness(1.08)}
.mic-btn[disabled]{background:var(--border);cursor:not-allowed;color:var(--text-faint)}
.mic-btn.recording{background:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,90,48,.45)}70%{box-shadow:0 0 0 9px rgba(216,90,48,0)}100%{box-shadow:0 0 0 0 rgba(216,90,48,0)}}
@media (prefers-reduced-motion: reduce){.mic-btn.recording{animation:none}}

.result-box{background:var(--surface-alt);border:1px solid var(--border-soft);border-radius:9px;padding:10px 12px;margin-top:10px;font-size:13px}
.score-row{margin-bottom:6px}
.diff-line{margin-top:5px;line-height:1.7}
.diff-lbl{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px;margin-right:4px}
.w{margin-right:4px;display:inline-block}
.w.ok{color:var(--success);font-weight:700}
.w.miss{color:var(--danger);text-decoration:line-through}
.w.extra{color:var(--warning)}
.err-msg{color:var(--danger);font-size:12.5px;margin-top:8px}

.bubble{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13.5px;max-width:92%}
.bubble.app{background:var(--bubble-app);margin-right:auto}
.bubble.user{background:var(--bubble-user);margin-left:auto}
.bubble.current{border:1.5px solid var(--accent)}
.bubble-role{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;font-weight:700}
.bubble-text{line-height:1.5}

.hint{font-size:12.5px;color:var(--text-muted);margin-bottom:8px}

.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.2rem}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow)}
.mc label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.mc .v{font-family:'Sora',-apple-system,sans-serif;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}

.wf-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.wf-lbl{width:135px;color:var(--text-muted);font-size:12px;flex-shrink:0}
.wf-bw{flex:1;height:9px;background:var(--border-soft);border-radius:4px;overflow:hidden}
.wf-bf{height:100%;border-radius:4px;background:var(--accent)}
.wf-val{min-width:40px;text-align:right;font-weight:700;font-size:12px;flex-shrink:0;font-variant-numeric:tabular-nums}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:700;font-size:11px;color:var(--text-faint);padding:5px 7px;border-bottom:1px solid var(--border-soft);text-transform:uppercase;letter-spacing:.3px}
td{padding:7px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto}

textarea{font-family:inherit;resize:vertical;background:var(--surface);color:var(--text);border-color:var(--border)}
select,input[type=range]{font-size:12.5px}
.field-row{margin-bottom:16px}
.field-lbl{font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.rate-val{font-size:12.5px;color:var(--text);font-weight:700;margin-left:8px;font-variant-numeric:tabular-nums}
.status-line{font-size:12.5px;margin-bottom:6px;color:var(--text)}

.hero-card{background:linear-gradient(165deg,var(--surface) 0%,var(--surface-alt) 100%)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.hero-greet{font-family:'Sora',-apple-system,sans-serif;font-size:17px;font-weight:700}
.hero-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.streak-chip{background:var(--badge-ba-bg);color:var(--badge-ba-fg);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap}
.hero-stat{display:flex;align-items:center;gap:12px}
.hero-stat-lbl{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.hero-stat-val{font-family:'Sora',-apple-system,sans-serif;font-size:15px;font-weight:700;margin:1px 0}

.mode-switch{display:flex;gap:6px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:9px;padding:4px;margin-bottom:14px}
.mode-btn{flex:1;padding:8px 10px;font-size:12.5px;font-weight:700;border:none;border-radius:6px;background:none;color:var(--text-muted);cursor:pointer}
.mode-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

.gauge-row{display:flex;align-items:center;gap:12px}
.tip-box{background:var(--badge-bb-bg);color:var(--badge-bb-fg);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:6px;line-height:1.5}
.xp-toast{display:inline-flex;align-items:center;gap:4px;background:var(--badge-bg-bg);color:var(--badge-bg-fg);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700}

.chat-wrap{display:flex;flex-direction:column}
.chat-log{max-height:420px;overflow-y:auto;padding-right:2px;margin-bottom:10px}
.chat-input-row{display:flex;gap:8px;align-items:center;justify-content:center;padding-top:6px;border-top:1px solid var(--border-soft)}
.turn-counter{font-size:11.5px;color:var(--text-muted);text-align:center;margin-bottom:8px}
</style>
</head>
<body>
<div class="app">
  <h1>🗣️ İngilizce Konuşma Pratiği</h1>
  <div class="subtitle">Konuşma partnerinle sesli pratik yap, telaffuzunu anında puanla, XP kazanıp seviye atla.</div>

  <div id="banner"></div>

  <div class="tabs">
    <button class="tab active" onclick="sw('anasayfa')">🏠 Anasayfa</button>
    <button class="tab" onclick="sw('dersler')">🎯 Dersler</button>
    <button class="tab" onclick="sw('konusma')">🗨️ Konuşma</button>
    <button class="tab" onclick="sw('serbest')">✍️ Serbest</button>
    <button class="tab" onclick="sw('ilerleme')">📈 İlerleme</button>
    <button class="tab" onclick="sw('ayarlar')">⚙️ Ayarlar</button>
  </div>

  <div id="s-anasayfa" class="sec active"></div>
  <div id="s-dersler" class="sec"></div>
  <div id="s-konusma" class="sec"></div>
  <div id="s-serbest" class="sec"></div>
  <div id="s-ilerleme" class="sec"></div>
  <div id="s-ayarlar" class="sec"></div>
</div>

<script>
// ── Veri: pratik cümleleri ──
const CATEGORIES = [
  {slug:'selam',    label:'Selamlaşma & Tanışma',     level:'Başlangıç'},
  {slug:'gunluk',   label:'Günlük Konuşma',           level:'Başlangıç'},
  {slug:'restoran', label:'Restoran & Kafe',          level:'Orta'},
  {slug:'seyahat',  label:'Seyahat & Havaalanı',      level:'Orta'},
  {slug:'telefon',  label:'Telefon Görüşmesi',        level:'Orta'},
  {slug:'is',       label:'İş Görüşmesi',             level:'İleri'},
];

const SENTENCES = [
  {id:1,  cat:'selam', en:"Hi, how are you doing today?", tr:"Merhaba, bugün nasılsın?"},
  {id:2,  cat:'selam', en:"Nice to meet you. What's your name?", tr:"Tanıştığımıza memnun oldum. Adın ne?"},
  {id:3,  cat:'selam', en:"I'm doing great, thanks for asking.", tr:"Çok iyiyim, sorduğun için teşekkürler."},
  {id:4,  cat:'selam', en:"Where are you from originally?", tr:"Aslen nerelisin?"},
  {id:5,  cat:'selam', en:"It was really nice talking to you.", tr:"Seninle konuşmak gerçekten güzeldi."},

  {id:6,  cat:'gunluk', en:"What did you do over the weekend?", tr:"Hafta sonu ne yaptın?"},
  {id:7,  cat:'gunluk', en:"I usually wake up around seven in the morning.", tr:"Genelde sabah yedi civarı kalkarım."},
  {id:8,  cat:'gunluk', en:"Can you help me with something, please?", tr:"Bana bir konuda yardım edebilir misin lütfen?"},
  {id:9,  cat:'gunluk', en:"I'm a little tired today, to be honest.", tr:"Açıkçası bugün biraz yorgunum."},
  {id:10, cat:'gunluk', en:"Let's meet up sometime next week.", tr:"Önümüzdeki hafta bir ara buluşalım."},

  {id:11, cat:'restoran', en:"Could I see the menu, please?", tr:"Menüyü görebilir miyim lütfen?"},
  {id:12, cat:'restoran', en:"I'd like to order a medium coffee with milk.", tr:"Sütlü, orta boy bir kahve almak istiyorum."},
  {id:13, cat:'restoran', en:"Is this dish spicy? I can't handle spicy food.", tr:"Bu yemek acılı mı? Acı yemeğe dayanamam."},
  {id:14, cat:'restoran', en:"Could we get the bill, please?", tr:"Hesabı alabilir miyiz lütfen?"},
  {id:15, cat:'restoran', en:"Everything was delicious, thank you.", tr:"Her şey çok lezzetliydi, teşekkür ederim."},

  {id:16, cat:'seyahat', en:"Excuse me, where is the nearest bus stop?", tr:"Affedersiniz, en yakın otobüs durağı nerede?"},
  {id:17, cat:'seyahat', en:"I'd like to check in for my flight, please.", tr:"Uçuşum için check-in yaptırmak istiyorum lütfen."},
  {id:18, cat:'seyahat', en:"How long does it take to get to the city center?", tr:"Şehir merkezine ulaşmak ne kadar sürer?"},
  {id:19, cat:'seyahat', en:"I think I'm lost. Can you show me on the map?", tr:"Sanırım kayboldum. Haritada gösterebilir misiniz?"},
  {id:20, cat:'seyahat', en:"What time does the train leave?", tr:"Tren kaçta kalkıyor?"},

  {id:21, cat:'telefon', en:"Hello, may I speak to Mr. Johnson, please?", tr:"Merhaba, Bay Johnson ile görüşebilir miyim lütfen?"},
  {id:22, cat:'telefon', en:"I'm calling about the appointment I made yesterday.", tr:"Dün aldığım randevu hakkında arıyorum."},
  {id:23, cat:'telefon', en:"Could you repeat that? The line is a bit unclear.", tr:"Tekrar edebilir misiniz? Hat biraz net değil."},
  {id:24, cat:'telefon', en:"I'll call you back in about ten minutes.", tr:"Sizi yaklaşık on dakika içinde geri arayacağım."},
  {id:25, cat:'telefon', en:"Thank you for your time. Have a good day.", tr:"Vaktiniz için teşekkür ederim. İyi günler."},

  {id:26, cat:'is', en:"I have over five years of experience in this field.", tr:"Bu alanda beş yılı aşkın deneyimim var."},
  {id:27, cat:'is', en:"I'm a fast learner and I adapt well to new environments.", tr:"Hızlı öğrenen biriyim ve yeni ortamlara kolay uyum sağlarım."},
  {id:28, cat:'is', en:"What are the main responsibilities of this position?", tr:"Bu pozisyonun ana sorumlulukları nelerdir?"},
  {id:29, cat:'is', en:"I believe my skills align well with your requirements.", tr:"Yeteneklerimin sizin gereksinimlerinizle iyi örtüştüğünü düşünüyorum."},
  {id:30, cat:'is', en:"Thank you for considering my application.", tr:"Başvurumu değerlendirdiğiniz için teşekkür ederim."},
];

// ── Veri: iş İngilizcesi (business English) senaryoları ──
const DIALOGUES = [
  {
    id:'meeting', title:'Haftalık Ekip Toplantısı', level:'Orta',
    desc:'Bir ekip toplantısında güncelleme paylaşmayı ve fikir belirtmeyi pratik et.',
    lines:[
      {speaker:'app',  text:"Good morning, everyone. Let's start with a quick round of updates. Can you tell us what you've been working on this week?"},
      {speaker:'user', hint:'Bu haftaki çalışmalarını kısaca özetle.', keywords:['working on','this week','finished','progress','currently'], model:"Sure. This week I've been working on the client proposal, and it's almost finished."},
      {speaker:'app',  text:"Great progress. Are there any blockers or challenges you're facing?"},
      {speaker:'user', hint:'Bir engel olup olmadığını belirt.', keywords:['blocker','challenge','waiting','need','no'], model:"Not really, but I'm still waiting on feedback from the design team."},
      {speaker:'app',  text:"Understood, I'll follow up with them. Does anyone have questions or comments before we move on?"},
      {speaker:'user', hint:'Kısa bir yorum ya da soru sor.', keywords:['question','comment','think','agree','suggest'], model:"I just wanted to add that we might need one more day for testing."},
      {speaker:'app',  text:"Good point, noted. Thanks everyone, let's wrap up here. Have a productive week!"},
    ]
  },
  {
    id:'presentation', title:'Sunum Yapma', level:'İleri',
    desc:'Bir iş sunumunu İngilizce olarak sunmayı ve soruları yanıtlamayı pratik et.',
    lines:[
      {speaker:'app',  text:"Whenever you're ready, please go ahead and start your presentation."},
      {speaker:'user', hint:'Sunumuna kısa bir giriş yap.', keywords:['today','present','going to','overview','talk about'], model:"Thank you. Today, I'm going to present our quarterly sales results and next steps."},
      {speaker:'app',  text:"Thanks for the overview. Could you walk us through the key numbers?"},
      {speaker:'user', hint:'Ana rakamları/özet noktaları anlat.', keywords:['increased','grew','percent','compared','revenue'], model:"Sure. Our revenue grew by fifteen percent compared to last quarter."},
      {speaker:'app',  text:"Impressive results. One question from the audience: what caused this growth?"},
      {speaker:'user', hint:'Büyümenin nedenini açıkla.', keywords:['because','mainly','new','strategy','customers'], model:"That's mainly because of our new marketing strategy and several new customers."},
      {speaker:'app',  text:"Great answer, very clear. Thank you for the presentation, well done!"},
    ]
  },
  {
    id:'negotiation', title:'Müzakere / Anlaşma Görüşmesi', level:'İleri',
    desc:'Bir sözleşmenin şartlarını müzakere etmeyi pratik et.',
    lines:[
      {speaker:'app',  text:"Thanks for meeting with me. Let's discuss the terms of the contract. What's your initial proposal?"},
      {speaker:'user', hint:'Başlangıç teklifini sun.', keywords:['propose','offer','price','think','would like'], model:"We'd like to propose a six-month contract at the current rate."},
      {speaker:'app',  text:"I appreciate that, but we were hoping for a bit more flexibility on the price. Can we find a middle ground?"},
      {speaker:'user', hint:'Karşı teklif veya uzlaşma öner.', keywords:['could','maybe','meet','agree','compromise','flexible'], model:"I understand. Maybe we could agree on a small discount for a longer contract."},
      {speaker:'app',  text:"That sounds reasonable. Let's say twelve months with a five percent discount. Does that work for you?"},
      {speaker:'user', hint:'Teklifi kabul et ya da netleştir.', keywords:['sounds good','agree','deal','works','yes'], model:"Yes, that sounds like a fair deal. Let's move forward with that."},
      {speaker:'app',  text:"Excellent, I'll have the contract updated and sent over today. Great doing business with you!"},
    ]
  },
  {
    id:'interview', title:'İş Görüşmesi', level:'İleri',
    desc:'Bir iş görüşmesinde kendini ifade etmeyi pratik et.',
    lines:[
      {speaker:'app',  text:"Thanks for coming in today. Can you tell me a little about yourself?"},

function ringSVG(pct, opts){
  opts = opts || {};
  const size = opts.size || 70, stroke = opts.stroke || 6;
  const color = opts.color || 'var(--accent)', track = opts.track || 'var(--border-soft)';
  const r = (size/2) - stroke, c = 2*Math.PI*r;
  const clamped = Math.max(0, Math.min(100, pct));
  const offset = c * (1 - clamped/100);
  const cx = size/2, cy = size/2;
  const centerHtml = (opts.center!==undefined) ? `<text x="${cx}" y="${cy + (opts.centerSize||16)*0.35}" text-anchor="middle" font-size="${opts.centerSize||16}" font-weight="700" fill="var(--text)" font-family="Sora, sans-serif">${escapeHtml(String(opts.center))}</text>` : '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"></circle>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"></circle>
    ${centerHtml}
  </svg>`;
}
function scoreGaugeSVG(score, size){
  size = size || 62;
  const color = score>=85 ? 'var(--success)' : score>=60 ? 'var(--warning)' : 'var(--danger)';
  return ringSVG(score, {size, stroke:5, color, center:score, centerSize:Math.round(size*0.26)});
}

// ── Kelime hizalama / skor (LCS tabanlı) ──
function normWords(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean); }
function alignWords(target, spoken){
  const a = normWords(target), b = normWords(spoken);
  const n=a.length, m=b.length;
  const dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  let i=n, j=m;
  const aMatch = new Array(n).fill(false), bMatch = new Array(m).fill(false);
  while(i>0 && j>0){
    if(a[i-1]===b[j-1]){ aMatch[i-1]=true; bMatch[j-1]=true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--; else j--;
  }
  const score = n ? Math.round(dp[n][m]/n*100) : 0;
  return {targetWords:a, spokenWords:b, aMatch, bMatch, score};
}
function renderDiffHTML(align){
  const tHtml = align.targetWords.map((w,idx)=>`<span class="w ${align.aMatch[idx]?'ok':'miss'}">${escapeHtml(w)}</span>`).join('');
  const sHtml = align.spokenWords.length ? align.spokenWords.map((w,idx)=>`<span class="w ${align.bMatch[idx]?'ok':'extra'}">${escapeHtml(w)}</span>`).join('') : '<span class="muted">(algılanamadı)</span>';
  return {tHtml, sHtml};
}
function keywordScore(spoken, keywords){
  if(!keywords || !keywords.length) return spoken.trim() ? 80 : 0;
  const norm = ' ' + String(spoken||'').toLowerCase().replace(/[^a-z0-9' ]+/g,' ') + ' ';
  let hit = 0;
  keywords.forEach(k => { if(norm.includes(k.toLowerCase())) hit++; });
  return Math.round(hit/keywords.length*100);
}

const CLAUDE_API_URL = 'https://api.anthropic.com/v1/messages';
function aiEnabled(){ return !!(settings.apiKey && settings.apiKey.trim()); }
async function callClaudeAPI(messages, systemPrompt, maxTokens){
  const res = await fetch(CLAUDE_API_URL, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': settings.apiKey.trim(),
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: settings.aiModel || 'claude-haiku-4-5-20251001',
      max_tokens: maxTokens || 200,
      system: systemPrompt,
      messages: messages,
    }),
  });
  if(!res.ok){
    let detail = '';
    try{ const body = await res.json(); detail = body.error && body.error.message ? body.error.message : JSON.stringify(body); }catch(e){}
    throw new Error(`API hatası (${res.status}): ${detail || res.statusText}`);
  }
  const data = await res.json();
  return data.content && data.content[0] && data.content[0].text ? data.content[0].text.trim() : '';
}

function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function classifyIntent(text){
  const t = ' ' + String(text||'').toLowerCase() + ' ';
  for(const intent of INTENTS){ for(const p of intent.patterns){ if(p.test(t)) return intent; } }
  return null;
}
function freeChatReplyLocal(userText){

function accentLang(){ return settings.accent || 'en-US'; }
function refreshVoices(){
  if(!('speechSynthesis' in window)) return;
  voices = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('en'));
  if(currentTab==='ayarlar') renderAyarlar();
}
function getSelectedVoice(){
  if(settings.voiceURI){
    const v = voices.find(x=>x.voiceURI===settings.voiceURI);
    if(v) return v;
  }
  const accent = accentLang();
  const natural = voices.find(v => v.lang===accent && /natural|online|neural/i.test(v.name));
  if(natural) return natural;
  const exact = voices.find(v => v.lang===accent);
  if(exact) return exact;
  const primary = accent.split('-')[0];
  const partial = voices.find(v => v.lang.toLowerCase().startsWith(primary));
  if(partial) return partial;
  return voices[0] || null;
}
function speak(text, rateOverride){
  if(!('speechSynthesis' in window) || !text) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  const v = getSelectedVoice();
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = accentLang(); }
  u.rate = rateOverride || settings.rate || 0.95;
  speechSynthesis.speak(u);
}

function micSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function toggleMic(kind, key){
  if(recState.active){
    if(recState.kind===kind && String(recState.key)===String(key)) recState.rec.stop();
    return;
  }
  if(!micSupported()){ alert('Tarayıcınız gerçek zamanlı konuşma tanımayı desteklemiyor. Lütfen bilgisayarda Google Chrome veya Microsoft Edge kullanın.'); return; }
  if(kind==='free'){
    const el = document.getElementById('free-input');
    const txt = el ? el.value : freeText;
    if(!txt || !txt.trim()){ alert('Önce pratik edeceğin İngilizce metni yaz.'); return; }
  }
  delete errorMsgs[kind+':'+key];
  const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SRClass();
  rec.lang = accentLang();
  rec.interimResults = false;
  rec.continuous = false;
  rec.maxAlternatives = 1;
  recState = {active:true, kind, key, rec};
  renderCurrent();
  rec.onresult = (e) => {
    let t = '';
    for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript;
    handleTranscript(kind, key, t.trim());
  };
  rec.onerror = (e) => {
    recState = {active:false, kind:null, key:null, rec:null};
    errorMsgs[kind+':'+key] = e.error==='no-speech' ? 'Ses algılanamadı, tekrar deneyin.'
      : e.error==='not-allowed' ? 'Mikrofon izni verilmedi. Tarayıcı ayarlarından izin verin.'
      : 'Bir hata oluştu: ' + e.error;
    renderCurrent();
  };
  rec.onend = () => {
    if(recState.active && recState.kind===kind && String(recState.key)===String(key)){
      recState = {active:false, kind:null, key:null, rec:null};
      renderCurrent();
    }
  };
  try{ rec.start(); }catch(err){ recState = {active:false, kind:null, key:null, rec:null}; }
}
function micButtonHTML(kind, key){
  const isThis = recState.active && recState.kind===kind && String(recState.key)===String(key);
  const otherActive = recState.active && !isThis;
  const label = isThis ? '⏹ Durdur' : '🎤 Kaydet';
  const cls = 'mic-btn' + (isThis ? ' recording' : '');
  const disabledAttr = otherActive ? 'disabled' : '';
  const keyArg = typeof key==='number' ? key : `'${key}'`;
  return `<button class="${cls}" ${disabledAttr} onclick="toggleMic('${kind}', ${keyArg})">${label}</button>`;
}
function resultBlockHTML(kind, key){
  const err = errorMsgs[kind+':'+key];
  if(err) return `<div class="err-msg">⚠️ ${escapeHtml(err)}</div>`;
  const r = liveResults[kind+':'+key];
  if(!r) return '';
  const {tHtml, sHtml} = renderDiffHTML(r.align);
  const score = r.align.score;
  const tip = score<90 ? getPronTip(r.align.targetWords.join(' ')) : null;
  return `<div class="result-box">
    <div class="gauge-row">
      ${scoreGaugeSVG(score)}
      <div>
        <div class="score-row"><span class="bdg ${scoreBadgeClass(score)}">${scoreLabel(score)}</span> <span class="xp-toast">+${xpForScore(score)} XP</span></div>
        ${tip ? `<div class="tip-box">💡 ${escapeHtml(tip)}</div>` : ''}
      </div>
    </div>
    <div class="diff-line"><span class="diff-lbl">Hedef</span><br>${tHtml}</div>
    <div class="diff-line"><span class="diff-lbl">Senin söylediğin</span><br>${sHtml}</div>
  </div>`;
}

function recordAttempt(obj){
  state.attempts.unshift(Object.assign({ts:Date.now()}, obj));
  if(state.attempts.length>500) state.attempts.length = 500;
  if(typeof obj.score==='number') addXp(xpForScore(obj.score));
}
function updateBest(id, score){
  if(!(id in state.bestScores) || score > state.bestScores[id]) state.bestScores[id] = score;
}
function handleTranscript(kind, key, transcript){
  if(kind==='sentence'){
    const s = SENTENCES.find(x=>x.id===Number(key));
    if(!s) return;
    const align = alignWords(s.en, transcript);
    liveResults['sentence:'+key] = {transcript, align};
    updateBest(s.id, align.score);
    recordAttempt({kind:'sentence', cat:s.cat, text:s.en, score:align.score});
  } else if(kind==='free'){
    const el = document.getElementById('free-input');
    const target = (el ? el.value : freeText) || '';
    const align = alignWords(target, transcript);
    liveResults['free:'+key] = {transcript, align};
    recordAttempt({kind:'free', cat:'serbest', text:target.slice(0,80), score:align.score});
  } else if(kind==='dialogue'){
    const idx = key.lastIndexOf(':');
    const dlgId = key.slice(0, idx);
    const lineIndex = Number(key.slice(idx+1));
    const d = DIALOGUES.find(x=>x.id===dlgId);
    if(!d) return;
    const line = d.lines[lineIndex];
    const score = keywordScore(transcript, line.keywords);
    if(!state.dialogProgress[dlgId]) state.dialogProgress[dlgId] = {lineIndex:0, answers:{}};
    state.dialogProgress[dlgId].answers[lineIndex] = {transcript, score};
    recordAttempt({kind:'dialogue', cat:dlgId, text:line.model, score});
  } else if(kind==='freechat'){
    if(!transcript){ save(); renderCurrent(); return; }
    chatState.messages.push({speaker:'user', text:transcript});
    chatState.turns++;
    chatState.thinking = true;
    chatState.apiError = null;
    addXp(3);
    save();
    renderCurrent();
    processFreeChatReply();
    return;
  }
  save();
  renderCurrent();
}

  document.getElementById('s-'+n).classList.add('active');

}
function renderCurrent(){
  if(currentTab==='anasayfa') renderAnasayfa();

  else if(currentTab==='konusma') renderKonusma();
  else if(currentTab==='serbest') renderSerbest();
  else if(currentTab==='ilerleme') renderIlerleme();
  else if(currentTab==='ayarlar') renderAyarlar();
}

function openDialogue(id){
  currentDialogueId = id;
  if(!state.dialogProgress[id]) state.dialogProgress[id] = {lineIndex:0, answers:{}};
  maybeSpeakCurrentDialogueLine();
  save();
  renderCurrent();
}
function backToDialogueList(){ currentDialogueId = null; renderCurrent(); }
function maybeSpeakCurrentDialogueLine(){
  const d = DIALOGUES.find(x=>x.id===currentDialogueId);
  if(!d) return;
  const prog = state.dialogProgress[d.id];
  if(prog.lineIndex < d.lines.length && d.lines[prog.lineIndex].speaker==='app'){
    speak(d.lines[prog.lineIndex].text);
  }
}
function advanceDialogue(){
  const d = DIALOGUES.find(x=>x.id===currentDialogueId);
  const prog = state.dialogProgress[d.id];
  prog.lineIndex++;
  save();
  maybeSpeakCurrentDialogueLine();
  renderCurrent();
}
function restartDialogue(id){
  state.dialogProgress[id] = {lineIndex:0, answers:{}};
  currentDialogueId = id;
  save();
  maybeSpeakCurrentDialogueLine();
  renderCurrent();
}

  }

  const d = DIALOGUES.find(x=>x.id===currentDialogueId);

  let history = '';
  for(let i=0;i<Math.min(prog.lineIndex, d.lines.length);i++){

      history += `<div class="bubble app"><div class="bubble-role">🤖 Konuşma Partneri</div><div class="bubble-text">${escapeHtml(line.text)}</div></div>`;
    } else {
      const ans = prog.answers[i];

    }

  let current = '';

      current = `<div class="bubble app current">

    } else {

      current = `<div class="bubble user current">

        ${errorMsgs['dialogue:'+key] ? `<div class="err-msg">⚠️ ${escapeHtml(errorMsgs['dialogue:'+key])}</div>` : ''}
        ${ans ? `
          <div class="result-box">
            <div class="score-row"><span class="bdg ${scoreBadgeClass(ans.score)}">Skor: ${ans.score}</span></div>
            <div class="diff-line"><span class="diff-lbl">Sen dedin ki</span><br>${escapeHtml(ans.transcript || '(sessiz)')}</div>
            <div class="diff-line"><span class="diff-lbl">Örnek cevap</span><br>${escapeHtml(line.model)} <button class="mini-btn" onclick="speakDialogueModel('${d.id}', ${prog.lineIndex})">🔊</button></div>
          </div>
          <div class="actions"><button class="ab" onclick="advanceDialogue()">Sonraki →</button></div>

      </div>`;
    }
  } else {
    const scores = Object.values(prog.answers).map(a=>a.score);
    const avg = scores.length ? Math.round(scores.reduce((s,v)=>s+v,0)/scores.length) : 0;
    current = `<div class="card" style="background:var(--surface-alt)">
      <div class="ct">🎉 Diyalog tamamlandı!</div>

  return `

// ── RENDER: İSTATİSTİK ──
function computeStreak(){
  const days = new Set(state.attempts.map(a => new Date(a.ts).toDateString()));
  let d = new Date(); d.setHours(0,0,0,0);
  if(!days.has(d.toDateString())) d.setDate(d.getDate()-1);
  let streak = 0;
  while(days.has(d.toDateString())){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function resetStats(){
  if(!confirm('Tüm ilerleme, XP ve istatistikler silinecek. Emin misin?')) return;
  state.attempts = []; state.bestScores = {}; state.dialogProgress = {};
  state.xp = 0; state.dailyLog = {date:'', xp:0};
  save(); renderCurrent();
}
function renderIlerleme(){
  const attempts = state.attempts;
  const total = attempts.length;
  const avg = total ? Math.round(attempts.reduce((s,a)=>s+a.score,0)/total) : 0;
  const streak = computeStreak();
  const xp = state.xp||0;
  const lvl = levelForXp(xp);

  const byCat = {};
  attempts.forEach(a => { (byCat[a.cat] = byCat[a.cat] || []).push(a.score); });
  const catAvgs = Object.entries(byCat).map(([cat,scores]) => ({
    cat, avg: Math.round(scores.reduce((s,v)=>s+v,0)/scores.length), count: scores.length
  })).sort((a,b) => b.avg - a.avg);

  const rows = attempts.slice(0,15).map(a => {
    const dt = new Date(a.ts);
    const dstr = dt.toLocaleDateString('tr-TR') + ' ' + dt.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    const text = (a.text||'').length>42 ? a.text.slice(0,42)+'…' : a.text;
    return `<tr>
      <td class="muted">${dstr}</td>
      <td>${escapeHtml(catLabel(a.cat))}</td>
      <td>${escapeHtml(text)}</td>
      <td><span class="bdg ${scoreBadgeClass(a.score)}">${a.score}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('s-ilerleme').innerHTML = `
    <div class="mg">
      <div class="mc"><label>Seviye</label><div class="v">${lvl.name}</div></div>
      <div class="mc"><label>Toplam XP</label><div class="v">${xp}</div></div>
      <div class="mc"><label>Toplam Deneme</label><div class="v">${total}</div></div>
      <div class="mc"><label>Ortalama Skor</label><div class="v">${avg}</div></div>
      <div class="mc"><label>Pratik Serisi</label><div class="v">${streak} gün</div></div>
    </div>

    <div class="card">
      <div class="ch"><span class="ct">Kategori bazlı ortalama</span></div>
      ${catAvgs.length ? catAvgs.map(c => `

    </div>

    <div class="card">
      <div class="ch"><span class="ct">Son denemeler</span></div>
      ${rows ? `<table><thead><tr><th>Tarih</th><th>Kategori</th><th>Metin</th><th>Skor</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="muted">Henüz pratik yapılmadı.</div>'}
    </div>

  let voiceBlock;
  if(!('speechSynthesis' in window)){
    voiceBlock = '<div class="muted">Tarayıcınız sesli okuma (speech synthesis) özelliğini desteklemiyor.</div>';
  } else if(voices.length===0){
    voiceBlock = `<div class="muted">Sesler yükleniyor… Bulunamazsa birkaç saniye sonra tekrar dene.</div>
      <div class="actions"><button class="ab2" onclick="refreshVoices();renderAyarlar()">Yenile</button></div>`;
  } else {
    const voiceOpts = ['<option value="">Otomatik (en iyi eşleşen ses)</option>']
      .concat(voices.map(v => `<option value="${v.voiceURI}" ${settings.voiceURI===v.voiceURI?'selected':''}>${escapeHtml(v.name)} — ${v.lang}</option>`)).join('');
    voiceBlock = `<select onchange="setVoice(this.value)" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)">${voiceOpts}</select>
      <div class="muted" style="margin-top:6px">İşletim sisteminde "Natural"/"Online"/"Neural" etiketli sesler varsa (Edge/Chrome), en doğal sonucu bunlar verir.</div>`;
  }

  document.getElementById('s-ayarlar').innerHTML = `
    <div class="card">
      <div class="ct" style="margin-bottom:14px">Ses & Tanıma Ayarları</div>

      <div class="field-row">
        <div class="field-lbl">Aksan / Mikrofon dili</div>
        <select onchange="setAccent(this.value)" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)">${accentOpts}</select>
      </div>

      <div class="field-row">
        <div class="field-lbl">Geri bildirim sesi</div>
        ${voiceBlock}
      </div>

      <div class="field-row">
        <div class="field-lbl">Konuşma hızı <span class="rate-val" id="rate-val">${settings.rate}</span></div>
        <input type="range" min="0.6" max="1.3" step="0.05" value="${settings.rate}" style="width:100%" oninput="onRateInput(this.value)" onchange="onRateChange(this.value)">
      </div>

      <div class="actions"><button class="ab" onclick="speak('Hello! This is a test of the selected voice. I hope it sounds clear and natural.')">🔊 Test Et</button></div>
    </div>

    <div class="card">
      <div class="ch">
        <span class="ct">✨ Yapay Zeka Destekli Konuşma Partneri</span>
        <span class="bdg ${aiEnabled()?'bg':'bk'}">${aiEnabled()?'Bağlı':'Bağlı değil'}</span>
      </div>
      <div class="muted" style="margin-bottom:12px">Serbest Sohbet modunu gerçek Claude modeliyle çalıştırmak için kendi Anthropic API anahtarını gir. Bu uygulama sunucusuz (statik) çalıştığı için istekler doğrudan bu tarayıcıdan Anthropic'e gönderilir; anahtarın yalnızca bu cihazın localStorage'ında saklanır, başka hiçbir yere gönderilmez. Anahtarını console.anthropic.com üzerinden oluşturabilirsin.</div>

      <div class="field-row">
        <div class="field-lbl">Anthropic API Anahtarı</div>
        <input type="password" value="${escapeHtml(settings.apiKey)}" placeholder="sk-ant-..." style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)" oninput="onApiKeyInput(this.value)" onchange="onApiKeyChange(this.value)">
      </div>

      <div class="field-row">
        <div class="field-lbl">Model</div>
        <select onchange="setAiModel(this.value)" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text)">
          <option value="claude-haiku-4-5-20251001" ${settings.aiModel==='claude-haiku-4-5-20251001'?'selected':''}>Haiku — hızlı ve ekonomik (önerilen)</option>
          <option value="claude-sonnet-5" ${settings.aiModel==='claude-sonnet-5'?'selected':''}>Sonnet — daha güçlü, daha yavaş</option>
        </select>
      </div>

      <div class="actions">
        <button class="ab" id="api-test-btn" onclick="testApiConnection()">🔌 Bağlantıyı Test Et</button>
        ${settings.apiKey ? `<button class="ab2" onclick="clearApiKey()">Anahtarı Sil</button>` : ''}
      </div>
      <div class="muted" style="margin-top:10px">API anahtarı boşsa Serbest Sohbet, kural tabanlı yerel motorla (internet gerekmeden) çalışmaya devam eder.</div>
    </div>

    <div class="card">
      <div class="ct" style="margin-bottom:10px">Tarayıcı Desteği</div>
      <div class="status-line">🎤 Konuşma tanıma (mikrofon): ${micSupported() ? '✅ Destekleniyor' : '❌ Desteklenmiyor'}</div>
      <div class="status-line">🔊 Sesli okuma: ${('speechSynthesis' in window) ? '✅ Destekleniyor' : '❌ Desteklenmiyor'}</div>
      <div class="muted">En iyi deneyim için bilgisayarda Google Chrome veya Microsoft Edge kullanılması önerilir.</div>
    </div>
  `;
}

// ── Başlangıç ──
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = refreshVoices; refreshVoices(); }
if(!micSupported()){
  document.getElementById('banner').innerHTML = `<div class="warn-banner">🎤 Tarayıcınız gerçek zamanlı konuşma tanımayı desteklemiyor. En iyi deneyim için bilgisayarda <b>Google Chrome</b> veya <b>Microsoft Edge</b> kullanmanızı öneririz. Dinleme (seslendirme) özellikleri yine de çalışır.</div>`;
}
renderCurrent();
</script>
</body>
</html>
