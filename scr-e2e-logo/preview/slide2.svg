<foreignObject x="38.4" y="548.24" width="460.8" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="width:460.8px;height:24px;display:flex;flex-direction:column;justify-content:flex-start;text-align:center;font-family:Arial,'Liberation Sans',sans-serif;font-size:14.666666666666666px;line-height:1.2;letter-spacing:5.333333333333333px;font-style:normal;font-weight:400;color:#6B6B6B"><div style="margin-bottom:0px"><span style="color:#6B6B6B;font-weight:400">ONE JOURNEY. ONE IDENTITY.</span></div></div></foreignObject>
<foreignObject x="595.2" y="57.6" width="633.6" height="67.2"><div xmlns="http://www.w3.org/1999/xhtml" style="width:633.6px;height:67.2px;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;font-family:Arial,'Liberation Sans',sans-serif;font-size:42.666666666666664px;line-height:1.2;letter-spacing:0px;font-style:normal;font-weight:700;color:#2B2B2B"><div style="margin-bottom:0px"><span style="color:#2B2B2B;font-weight:700">SCR E2E Logo Proposal</span></div></div></foreignObject>
<foreignObject x="595.2" y="124.8" width="633.6" height="43.2"><div xmlns="http://www.w3.org/1999/xhtml" style="width:633.6px;height:43.2px;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;font-family:Arial,'Liberation Sans',sans-serif;font-size:24px;line-height:1.2;letter-spacing:0px;font-style:italic;font-weight:400;color:#E1000F"><div style="margin-bottom:0px"><span style="color:#E1000F;font-weight:400">People &amp; Journey Together</span></div></div></foreignObject>
<foreignObject x="595.2" y="196.8" width="624" height="336"><div xmlns="http://www.w3.org/1999/xhtml" style="width:624px;height:336px;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;font-family:Arial,'Liberation Sans',sans-serif;font-size:20px;line-height:1.2;letter-spacing:0px;font-style:normal;font-weight:400;color:#2B2B2B"><div style="margin-bottom:13.333333333333334px"><span style="color:#2B2B2B;font-weight:400">Four colleagues link arms to form one unbroken circle: each figure stands for a part of our end-to-end chain (Plan, Source, Make, Deliver), and only together do they create the shape.</span></div><div style="margin-bottom:13.333333333333334px"><span style="color:#2B2B2B;font-weight:400">People sit literally at the heart of the design: the ring exists because they hold on to each other, with E2E protected in the centre.</span></div><div style="margin-bottom:13.333333333333334px"><span style="color:#2B2B2B;font-weight:400">The arrowhead turns the circle into continuous forward motion: one journey that never stops improving.</span></div><div style="margin-bottom:13.333333333333334px"><span style="color:#2B2B2B;font-weight:400">Built only from circles and arcs in Henkel red tones, the mark stays simple and memorable from a slide footer to an event stage, in colour, white or one colour.</span></div></div></foreignObject>
